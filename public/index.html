<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام إدارة الموارد البشرية</title>
    <!-- استدعاء مكتبة البوتستراب عشان التصميم يطلع احترافي للموبايل والكمبيوتر -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f4f6f9; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card { 
            width: 100%;
            max-width: 400px;
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            border: none;
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
            padding: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card p-4 login-card">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">SaaS HR & Payroll</h3>
            <p class="text-muted">برجاء تسجيل الدخول للمتابعة</p>
        </div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label fw-bold">البريد الإلكتروني</label>
                <input type="email" class="form-control" id="email" required placeholder="admin@company.com" autocomplete="email">
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label fw-bold">كلمة المرور</label>
                <input type="password" class="form-control" id="password" required placeholder="••••••••" autocomplete="current-password">
            </div>
            
            <!-- رسالة الخطأ هتظهر هنا لو الباسورد غلط -->
            <div id="errorMessage" class="alert alert-danger d-none text-center" role="alert"></div>
            
            <button type="submit" id="loginBtn" class="btn btn-primary w-100 mt-2">
                <span id="btnText">تسجيل الدخول</span>
                <span id="btnLoader" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
            </button>
        </form>
    </div>

    <!-- هنربط ملف الجافاسكريبت اللي هيبعت البيانات للباك إند -->
    <script src="/js/auth.js"></script>
</body>
</html>
