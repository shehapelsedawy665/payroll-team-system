<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الموظفين - نظام الموارد البشرية</title>
    <!-- استدعاء مكتبة البوتستراب والأيقونات -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { 
            background-color: #f8f9fa; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .sidebar { 
            min-height: 100vh; 
            background-color: #212529; 
            color: white; 
            padding-top: 20px; 
        }
        .sidebar a { 
            color: #adb5bd; 
            text-decoration: none; 
            padding: 12px 20px; 
            display: block; 
            transition: 0.3s;
        }
        .sidebar a:hover, .sidebar a.active { 
            color: white; 
            background-color: #0d6efd; 
            border-radius: 5px;
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- القائمة الجانبية (للشاشات الكبيرة) -->
            <div class="col-md-2 sidebar d-none d-md-block">
                <h4 class="text-center text-white mb-4 fw-bold">HR SaaS</h4>
                <a href="/dashboard.html"><i class="bi bi-house-door me-2"></i> الرئيسية</a>
                <a href="/employees.html" class="active"><i class="bi bi-people me-2"></i> إدارة الموظفين</a>
                <a href="/attendance.html"><i class="bi bi-calendar-check me-2"></i> الحضور والانصراف</a>
                <a href="/payroll.html"><i class="bi bi-cash-stack me-2"></i> المرتبات</a>
                <a href="#" id="logoutBtn" class="text-danger mt-5"><i class="bi bi-box-arrow-right me-2"></i> تسجيل الخروج</a>
            </div>

            <!-- المحتوى الرئيسي -->
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold">إدارة الموظفين</h2>
                    <div>
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addEmployeeModal">
                            <i class="bi bi-person-plus"></i> إضافة موظف جديد
                        </button>
                        <!-- زرار القائمة الجانبية للموبايل -->
                        <button class="btn btn-outline-dark d-md-none ms-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar">
                            <i class="bi bi-list fs-4"></i>
                        </button>
                    </div>
                </div>

                <!-- جدول الموظفين -->
                <div class="card border-0 shadow-sm p-3">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>الاسم</th>
                                    <th>الكود الوظيفي</th>
                                    <th>القسم</th>
                                    <th>الراتب الأساسي</th>
                                    <th>الأجر التأميني</th>
                                    <th>الإجراءات</th>
                                </tr>
                            </thead>
                            <tbody id="employeesTableBody">
                                <tr>
                                    <td colspan="6" class="text-center text-muted py-3">جاري تحميل البيانات...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- القائمة الجانبية للموبايل (Offcanvas) -->
    <div class="offcanvas offcanvas-end bg-dark text-white" tabindex="-1" id="mobileSidebar">
        <div class="offcanvas-header border-bottom border-secondary">
            <h5 class="offcanvas-title fw-bold">HR SaaS</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body sidebar pt-0">
            <a href="/dashboard.html" class="mt-3"><i class="bi bi-house-door me-2"></i> الرئيسية</a>
            <a href="/employees.html" class="active"><i class="bi bi-people me-2"></i> إدارة الموظفين</a>
            <a href="/attendance.html"><i class="bi bi-calendar-check me-2"></i> الحضور والانصراف</a>
            <a href="/payroll.html"><i class="bi bi-cash-stack me-2"></i> المرتبات</a>
            <a href="#" id="logoutBtnMobile" class="text-danger mt-5"><i class="bi bi-box-arrow-right me-2"></i> تسجيل الخروج</a>
        </div>
    </div>

    <!-- نافذة إضافة موظف جديد (Modal) -->
    <div class="modal fade" id="addEmployeeModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">إضافة موظف جديد</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addEmployeeForm">
                        <div class="row g-3">
                            <!-- البيانات الأساسية -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold">الاسم الرباعي</label>
                                <input type="text" class="form-control" id="empName" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">الكود الوظيفي (Job ID)</label>
                                <input type="text" class="form-control" id="empJobId" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">الرقم القومي</label>
                                <input type="text" class="form-control" id="empNationalId" required maxlength="14">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">القسم</label>
                                <input type="text" class="form-control" id="empDepartment" required>
                            </div>
                            
                            <hr class="mt-4">
                            <h6 class="fw-bold text-primary mb-2">البيانات المالية والتأمينية</h6>
                            
                            <!-- البيانات المالية -->
                            <div class="col-md-4">
                                <label class="form-label">الراتب الأساسي</label>
                                <input type="number" class="form-control" id="empBasic" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">الراتب المتغير</label>
                                <input type="number" class="form-control" id="empVariable" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">الأجر التأميني</label>
                                <input type="number" class="form-control" id="empInsSalary" required>
                            </div>
                        </div>
                        
                        <div class="mt-4 text-end">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
                            <button type="submit" class="btn btn-primary" id="saveEmpBtn">
                                <span id="saveBtnText">حفظ الموظف</span>
                                <span id="saveBtnLoader" class="spinner-border spinner-border-sm d-none"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- ربط السكريبتات -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/employees.js"></script>
</body>
</html>
